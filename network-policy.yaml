apiVersion: v1
kind: Service
metadata:
  name: netpol-web
  namespace: default
  labels:
    app: netpol-web
spec:
  type: ClusterIP
  selector:
    app: netpol-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-web
  namespace: default
  labels:
    app: netpol-web
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      ports:
        - name: http
          containerPort: 8080
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www
          printf 'web\n' > /www/index.html
          exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-client
  namespace: default
  labels:
    app: netpol-client
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "---- client ----"
            wget -T 2 -qO- http://netpol-web:8080 || echo denied
            echo
            sleep 5
          done
---
apiVersion: v1
kind: Pod
metadata:
  name: netpol-stranger
  namespace: default
  labels:
    app: netpol-stranger
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "---- stranger ----"
            wget -T 2 -qO- http://netpol-web:8080 || echo denied
            echo
            sleep 5
          done
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-web
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: netpol-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: netpol-client
      ports:
        - protocol: TCP
          port: 8080
