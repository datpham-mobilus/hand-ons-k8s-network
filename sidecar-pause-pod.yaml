apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pause-net
  namespace: default
  labels:
    app: sidecar-pause-net
spec:
  restartPolicy: Always
  containers:
    - name: sidecar
      image: busybox:1.36
      ports:
        - name: http
          containerPort: 8080
      command: ["sh", "-c"]
      args:
        - |
          echo "sidecar netns $(readlink /proc/self/ns/net)"
          mkdir -p /www
          printf 'hello from sidecar\nshared pod netns held by pause\n' > /www/index.html
          exec httpd -f -p 8080 -h /www
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "app netns $(readlink /proc/self/ns/net)"
          until wget -qO- http://localhost:8080; do
            echo "sidecar not ready"
            sleep 1
          done
          echo
          while true; do
            echo "---- app -> localhost:8080 (pause netns) ----"
            wget -qO- http://localhost:8080
            echo
            sleep 5
          done