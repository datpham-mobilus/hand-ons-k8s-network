apiVersion: v1
kind: Service
metadata:
  name: ephemeral-pod-ip
  namespace: default
  labels:
    app: ephemeral-pod-ip
spec:
  type: ClusterIP
  selector:
    app: ephemeral-pod-ip
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-pod-ip-a
  namespace: default
  labels:
    app: ephemeral-pod-ip
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www
          printf 'pod %s ip %s\n' "$POD_NAME" "$POD_IP" > /www/index.html
          echo "pod ${POD_NAME} ip ${POD_IP}"
          exec httpd -f -p 8080 -h /www
---
