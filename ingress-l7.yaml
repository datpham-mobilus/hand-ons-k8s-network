apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: default
  labels:
    app: shop
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shop
  namespace: default
  labels:
    app: shop
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      ports:
        - name: http
          containerPort: 8080
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www
          printf 'shop\n' > /www/index.html
          printf 'shop\n' > /www/shop
          exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: default
  labels:
    app: api
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      ports:
        - name: http
          containerPort: 8080
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www
          printf 'api\n' > /www/api
          exec httpd -f -p 8080 -h /www
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: l7-routing
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /shop
            pathType: Exact
            backend:
              service:
                name: shop
                port:
                  name: http
          - path: /api
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  name: http
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: shop
                port:
                  name: http
