apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-pod-ip-a
  namespace: default
  labels:
    app: ephemeral-pod-ip
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      command: ["sh", "-c"]
      args:
        - |
          echo "pod ${POD_NAME} ip ${POD_IP}"
          while true; do sleep 3600; done
---
